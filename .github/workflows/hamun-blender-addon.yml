name: Hamun Blender Add-on Source Tests

on:
  push:
    branches:
      - feature/blender-source-integration
    paths:
      - "integrations/blender/**"
      - ".github/workflows/hamun-blender-addon.yml"
  pull_request:
    paths:
      - "integrations/blender/**"
      - ".github/workflows/hamun-blender-addon.yml"

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run add-on static tests
        run: python -m unittest discover -s integrations/blender/tests -v

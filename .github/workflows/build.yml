name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAMUN_BUILD_SANDBOX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run sandbox (Windows DX12 smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Run sandbox (Linux foundation smoke test)
        if: runner.os == 'Linux'
        run: ./build/Samples/Sandbox/HamunSandbox --smoke-test

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-37"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build Android debug APK
        working-directory: Platforms/Android
        run: gradle --no-daemon :app:assembleDebug

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAMUN_BUILD_SANDBOX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run sandbox (Windows)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe

      - name: Run sandbox (Linux)
        if: runner.os == 'Linux'
        run: ./build/Samples/Sandbox/HamunSandbox

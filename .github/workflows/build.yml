name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAMUN_BUILD_SANDBOX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Validate project templates and creation workflow
        if: runner.os == 'Windows'
        run: ./build/Tools/HamunLauncher/Release/HamunLauncher.exe --template-smoke-test

      - name: Run sandbox (Windows DX12 smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Run sandbox (Windows DX11 compatibility smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test --d3d11

      - name: Package Windows Test v0.5
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Tools/Package/PackageWindows.ps1 -BuildDir build -Configuration Release -Version v0.5 -OutputDir dist/Hamun_Test_v0.5

      - name: Upload Windows Test v0.5
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Hamun-Test-v0.5-Windows-x64
          path: dist/Hamun_Test_v0.5/
          if-no-files-found: error
          retention-days: 30

      - name: Run sandbox (Linux foundation smoke test)
        if: runner.os == 'Linux'
        run: ./build/Samples/Sandbox/HamunSandbox --smoke-test

  fsr-dx12:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AMD FidelityFX SDK v2.3.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty | Out-Null
          git clone --depth 1 --branch v2.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ThirdParty/FidelityFX-SDK

      - name: Configure FSR-enabled DX12 build
        shell: pwsh
        run: |
          $Sdk = (Resolve-Path "ThirdParty/FidelityFX-SDK").Path
          cmake -S . -B build-fsr -A x64 -DHAMUN_BUILD_SANDBOX=ON -DHAMUN_WITH_FSR_SDK=ON "-DHAMUN_FSR_SDK_DIR=$Sdk"

      - name: Build FSR-enabled DX12
        run: cmake --build build-fsr --config Release

      - name: Stage official AMD FSR runtime DLLs
        shell: pwsh
        run: |
          $Bin = "build-fsr/Samples/Sandbox/Release"
          $Signed = "ThirdParty/FidelityFX-SDK/Kits/FidelityFX/signedbin"
          Copy-Item "$Signed/amd_fidelityfx_loader_dx12.dll" $Bin
          Copy-Item "$Signed/amd_fidelityfx_upscaler_dx12.dll" $Bin

      - name: Report hosted-runner display adapter
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name,PNPDeviceID,AdapterRAM,DriverVersion | Format-List

      - name: Validate FSR runtime, provider and context
        shell: pwsh
        run: ./build-fsr/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test --fsr-context-only

      - name: Attempt live FSR DX12 dispatch on hosted runner
        continue-on-error: true
        shell: pwsh
        run: ./build-fsr/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Package FSR DX12 development test
        shell: pwsh
        run: |
          ./Tools/Package/PackageWindows.ps1 -BuildDir build-fsr -Configuration Release -Version FSR-Dev -OutputDir dist/Hamun_FSR_DX12_Dev
          $Signed = "ThirdParty/FidelityFX-SDK/Kits/FidelityFX/signedbin"
          Copy-Item "$Signed/amd_fidelityfx_loader_dx12.dll" "dist/Hamun_FSR_DX12_Dev"
          Copy-Item "$Signed/amd_fidelityfx_upscaler_dx12.dll" "dist/Hamun_FSR_DX12_Dev"
          @"
          @echo off
          cd /d "%~dp0"
          HamunSandbox.exe
          "@ | Set-Content -Encoding ASCII "dist/Hamun_FSR_DX12_Dev/Run_FSR_DX12.bat"

      - name: Upload FSR DX12 development test
        uses: actions/upload-artifact@v4
        with:
          name: Hamun-FSR-DX12-Dev-Windows-x64
          path: dist/Hamun_FSR_DX12_Dev/
          if-no-files-found: error
          retention-days: 14

  tressfx-sdk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AMD TressFX v4.1.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty | Out-Null
          git clone --depth 1 --branch v4.1.0 https://github.com/GPUOpen-Effects/TressFX.git ThirdParty/TressFX

      - name: Configure TressFX-enabled Hamun build
        shell: pwsh
        run: |
          $Sdk = (Resolve-Path "ThirdParty/TressFX").Path
          cmake -S . -B build-tressfx -A x64 -DHAMUN_BUILD_SANDBOX=ON -DHAMUN_WITH_TRESSFX_SDK=ON "-DHAMUN_TRESSFX_SDK_DIR=$Sdk"

      - name: Build TressFX-enabled Hamun
        run: cmake --build build-tressfx --config Release

      - name: Run TressFX bridge smoke test
        run: ./build-tressfx/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

  release-v0.5:
    needs: [desktop, fsr-dx12, tressfx-sdk]
    if: "${{ github.event_name == 'push' && (github.ref == 'refs/tags/v0.5' || startsWith(github.event.head_commit.message, 'release(test): package Hamun Test v0.5')) }}"
    runs-on: windows-latest

    steps:
      - name: Download main Windows test
        uses: actions/download-artifact@v4
        with:
          name: Hamun-Test-v0.5-Windows-x64
          path: release/main

      - name: Download FSR DX12 development test
        uses: actions/download-artifact@v4
        with:
          name: Hamun-FSR-DX12-Dev-Windows-x64
          path: release/fsr

      - name: Create release ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path "release/main/*" -DestinationPath "Hamun-Test-v0.5-Windows-x64.zip" -Force
          Compress-Archive -Path "release/fsr/*" -DestinationPath "Hamun-FSR-DX12-Dev-Windows-x64.zip" -Force

      - name: Publish Hamun Test v0.5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "v0.5"
          $MainZip = "Hamun-Test-v0.5-Windows-x64.zip"
          $FsrZip = "Hamun-FSR-DX12-Dev-Windows-x64.zip"

          gh release view $Tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag $MainZip $FsrZip --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create $Tag $MainZip $FsrZip `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Hamun Test v0.5" `
              --notes "v0.5 adds the Hamun project launcher/template workflow, native TressFX asset/GPU simulation foundations, HDR/motion/temporal resources, and an AMD FSR DX12 development package with official runtime DLLs. GitHub hosted runners use Microsoft Hyper-V Video, so live FSR dispatch remains a physical-GPU validation item."
          }

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build Android debug APK
        working-directory: Platforms/Android
        run: gradle --no-daemon :app:assembleDebug

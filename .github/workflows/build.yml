name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAMUN_BUILD_SANDBOX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run sandbox (Windows DX12 smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Run sandbox (Windows DX11 compatibility smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test --d3d11

      - name: Package Windows Test v0.4
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Tools/Package/PackageWindows.ps1 -BuildDir build -Configuration Release -Version v0.4 -OutputDir dist/Hamun_Test_v0.4

      - name: Upload Windows Test v0.4
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Hamun-Test-v0.4-Windows-x64
          path: dist/Hamun_Test_v0.4/
          if-no-files-found: error
          retention-days: 30

      - name: Create v0.4 ZIP
        if: "${{ runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release(test): package Hamun Test v0.4')) }}"
        shell: pwsh
        run: |
          $Zip = "dist/Hamun-Test-v0.4-Windows-x64.zip"
          if (Test-Path $Zip) {
            Remove-Item $Zip -Force
          }
          Compress-Archive -Path "dist/Hamun_Test_v0.4/*" -DestinationPath $Zip -Force

      - name: Publish v0.4 GitHub Release
        if: "${{ runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release(test): package Hamun Test v0.4')) }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "v0.4"
          $Zip = "dist/Hamun-Test-v0.4-Windows-x64.zip"

          gh release view $Tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag $Zip --clobber --repo "${{ github.repository }}"
          }
          else {
            gh release create $Tag $Zip --repo "${{ github.repository }}" --title "Hamun Test v0.4" --target "${{ github.sha }}" --notes "Windows x64 technical test build. Adds renderer-owned draw submission, double-buffered frame resources, DX12/DX11 compute dispatch, PBR metallic/roughness lighting, temporal FSR prerequisites, and the HamunHair/TressFX runtime foundation."
          }

      - name: Run sandbox (Linux foundation smoke test)
        if: runner.os == 'Linux'
        run: ./build/Samples/Sandbox/HamunSandbox --smoke-test

  fsr-dx12:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AMD FidelityFX SDK v2.3.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty | Out-Null
          git clone --depth 1 --branch v2.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ThirdParty/FidelityFX-SDK

      - name: Configure FSR-enabled DX12 build
        shell: pwsh
        run: |
          $Sdk = (Resolve-Path "ThirdParty/FidelityFX-SDK").Path
          cmake -S . -B build-fsr -A x64 -DHAMUN_BUILD_SANDBOX=ON -DHAMUN_WITH_FSR_SDK=ON "-DHAMUN_FSR_SDK_DIR=$Sdk"

      - name: Build FSR-enabled DX12
        run: cmake --build build-fsr --config Release

      - name: Stage official AMD FSR runtime DLLs
        shell: pwsh
        run: |
          $Bin = "build-fsr/Samples/Sandbox/Release"
          $Signed = "ThirdParty/FidelityFX-SDK/Kits/FidelityFX/signedbin"
          Copy-Item "$Signed/amd_fidelityfx_loader_dx12.dll" $Bin
          Copy-Item "$Signed/amd_fidelityfx_upscaler_dx12.dll" $Bin

      - name: Run live FSR DX12 smoke test
        shell: pwsh
        run: ./build-fsr/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Package FSR DX12 development test
        shell: pwsh
        run: ./Tools/Package/PackageWindows.ps1 -BuildDir build-fsr -Configuration Release -Version FSR-Dev -OutputDir dist/Hamun_FSR_DX12_Dev

      - name: Upload FSR DX12 development test
        uses: actions/upload-artifact@v4
        with:
          name: Hamun-FSR-DX12-Dev-Windows-x64
          path: dist/Hamun_FSR_DX12_Dev/
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build Android debug APK
        working-directory: Platforms/Android
        run: gradle --no-daemon :app:assembleDebug

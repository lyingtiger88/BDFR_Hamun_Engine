name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DHAMUN_BUILD_SANDBOX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run sandbox (Windows DX12 smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test

      - name: Run sandbox (Windows DX11 compatibility smoke test)
        if: runner.os == 'Windows'
        run: ./build/Samples/Sandbox/Release/HamunSandbox.exe --smoke-test --d3d11

      - name: Package Windows Test v0.1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Tools/Package/PackageWindows.ps1 -BuildDir build -Configuration Release -OutputDir dist/Hamun_Test_v0.1

      - name: Upload Windows Test v0.1
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Hamun-Test-v0.1-Windows-x64
          path: dist/Hamun_Test_v0.1/
          if-no-files-found: error
          retention-days: 30

      - name: Run sandbox (Linux foundation smoke test)
        if: runner.os == 'Linux'
        run: ./build/Samples/Sandbox/HamunSandbox --smoke-test

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Locate Android sdkmanager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build Android debug APK
        working-directory: Platforms/Android
        run: gradle --no-daemon :app:assembleDebug
